server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text and the icon fonts (the vector-icons font is ~1 MB uncompressed). Level 5 is close to the best
  # ratio at a fraction of the CPU of 9; gzip_vary keeps caches from serving a compressed body to a client without gzip.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject application/x-font-ttf;

  # Hashed bundles: cache for a year, and a missing one is a real 404 (not index.html).
  location /_expo/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # A missing version.json must be a real 404, never the SPA fallback.
  location = /version.json {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback for deep links.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}

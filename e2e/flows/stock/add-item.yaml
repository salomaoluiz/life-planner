url: ${E2E_WEB_URL}
name: stock/add-item
tags:
  - stock
  - spec-005
  - spec-011
  - smoke
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Rice
      KEY: ITEM_NAME
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/stock/open-stock.yaml
- extendedWaitUntil:
    visible:
      id: "stock.list.empty-state"
    timeout: 20000
- tapOn:
    id: "stock.list.add-button"
- extendedWaitUntil:
    visible:
      id: "stock.item-form.description-input"
    timeout: 20000
- tapOn:
    id: "stock.item-form.description-input"
- inputText: ${output.ITEM_NAME}
- tapOn:
    id: "stock.item-form.quantity-input"
- eraseText
- inputText: "3"
- tapOn:
    id: "stock.item-form.unit-select"
- tapOn:
    id: "stock.item-form.unit-select-option-kilogram"
- tapOn:
    id: "stock.item-form.save-button"
- extendedWaitUntil:
    visible:
      id: "stock.list.row-title"
      text: ${output.ITEM_NAME}
    timeout: 20000
- assertNotVisible:
    id: "stock.list.empty-state"
- assertVisible:
    id: "stock.list.row-quantity"
    text: ".*3.*"

url: ${E2E_WEB_URL}
name: stock/delete-item
tags:
  - stock
  - spec-005
  - spec-011
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Rice
      KEY: ITEM_NAME
- runFlow:
    file: ../../subflows/setup/create-stock-item.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      DESCRIPTION: ${output.ITEM_NAME}
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/stock/open-stock.yaml
- extendedWaitUntil:
    visible:
      id: "stock.list.row-title"
      text: ${output.ITEM_NAME}
    timeout: 20000
- tapOn:
    id: "stock.list.row-title"
    text: ${output.ITEM_NAME}
- extendedWaitUntil:
    visible:
      id: "stock.item-details.delete-button"
    timeout: 20000
- tapOn:
    id: "stock.item-details.delete-button"
- extendedWaitUntil:
    visible:
      id: "stock.item-details.delete-dialog-confirm"
    timeout: 20000
- tapOn:
    id: "stock.item-details.delete-dialog-confirm"
# The last item is gone: the empty state is back (not a stale row or the no-results block)
- extendedWaitUntil:
    visible:
      id: "stock.list.empty-state"
    timeout: 20000
- assertNotVisible:
    id: "stock.list.row-title"
    text: ${output.ITEM_NAME}
- assertNotVisible:
    id: "stock.list.no-results"

url: ${E2E_WEB_URL}
name: stock/add-item-validation
tags:
  - stock
  - spec-011
  - spec-116
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/stock/open-stock.yaml
- tapOn:
    id: "stock.list.add-button"
- extendedWaitUntil:
    visible:
      id: "stock.item-form.save-button"
    timeout: 20000
# Empty description
- tapOn:
    id: "stock.item-form.save-button"
- extendedWaitUntil:
    visible:
      id: "stock.item-form.description-input-error"
    timeout: 20000
- assertVisible:
    id: "stock.item-form.description-input"
# Whitespace-only description is rejected too
- tapOn:
    id: "stock.item-form.description-input"
- inputText: "   "
- tapOn:
    id: "stock.item-form.save-button"
- assertVisible:
    id: "stock.item-form.description-input-error"
# Spec 116: an empty quantity is valid (an item with no lot); an ideal not above the minimum is rejected
- tapOn:
    id: "stock.item-form.description-input"
- eraseText
- inputText: "E2E Validation"
- tapOn:
    id: "stock.item-form.min-input"
- inputText: "5"
- tapOn:
    id: "stock.item-form.ideal-input"
- inputText: "3"
- tapOn:
    id: "stock.item-form.save-button"
- extendedWaitUntil:
    visible:
      id: "stock.item-form.ideal-input-error"
    timeout: 20000
- assertVisible:
    id: "stock.item-form.save-button"

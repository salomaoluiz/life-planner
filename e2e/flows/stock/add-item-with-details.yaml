url: ${E2E_WEB_URL}
name: stock/add-item-with-details
tags:
  - stock
  - spec-011
  - spec-037
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Milk
      KEY: ITEM_NAME
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Brand
      KEY: BRAND_NAME
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/stock/open-stock.yaml
- tapOn:
    id: "stock.list.add-button"
- extendedWaitUntil:
    visible:
      id: "stock.item-form.description-input"
    timeout: 20000
- tapOn:
    id: "stock.item-form.description-input"
- inputText: ${output.ITEM_NAME}
# spec 037: on the wide web layout the more-details fields start open (right column)
- extendedWaitUntil:
    visible:
      id: "stock.item-form.more-toggle"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "stock.item-form.brand-input"
    timeout: 20000
- tapOn:
    id: "stock.item-form.brand-input"
- inputText: ${output.BRAND_NAME}
- tapOn:
    id: "stock.item-form.save-button"
- extendedWaitUntil:
    visible:
      id: "stock.list.row-title"
      text: ${output.ITEM_NAME}
    timeout: 20000
- tapOn:
    id: "stock.list.row-title"
    text: ${output.ITEM_NAME}
- extendedWaitUntil:
    visible:
      id: "stock.item-details.brand-value"
      text: ${output.BRAND_NAME}
    timeout: 20000

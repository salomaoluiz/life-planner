url: ${E2E_WEB_URL}
name: stock/catalog-sub-location
tags:
  - stock
  - spec-125
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/stock/open-stock.yaml
- runFlow: ../../subflows/stock/open-catalog.yaml
# Locations nest one level: Cozinha › Geladeira.
- tapOn:
    text: "Locais|Locations"
- tapOn:
    id: "stock.catalog.from-scratch"
- tapOn:
    id: "stock.catalog.name-input"
- inputText: "E2E Cozinha"
- tapOn:
    id: "stock.catalog.save-button"
- extendedWaitUntil:
    visible:
      text: "E2E Cozinha"
    timeout: 20000
- tapOn:
    text: "E2E Cozinha"
- tapOn:
    id: "stock.catalog.add-child"
- tapOn:
    id: "stock.catalog.name-input"
- inputText: "E2E Geladeira"
- tapOn:
    id: "stock.catalog.save-button"
- extendedWaitUntil:
    visible:
      text: "E2E Geladeira"
    timeout: 20000

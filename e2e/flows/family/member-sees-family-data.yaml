url: ${E2E_WEB_URL}
name: family/member-sees-family-data
tags:
  - family
  - spec-003
  - spec-005
  - spec-006
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
# Owner A
- runFlow: ../../subflows/signup-via-api.yaml
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Family
      KEY: FAMILY_NAME
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Family Account
      KEY: ACCOUNT_NAME
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Family Category
      KEY: CATEGORY_NAME
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Transaction
      KEY: TRANSACTION_NAME
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Rice
      KEY: ITEM_NAME
- runFlow:
    file: ../../subflows/setup/create-family.yaml
    env:
      TOKEN: ${output.TOKEN}
      NAME: ${output.FAMILY_NAME}
# Member B (joined) and stranger C (not in the family); the main keys stay A's
- runFlow:
    file: ../../subflows/setup/add-joined-member.yaml
    env:
      FAMILY_ID: ${output.FAMILY_ID}
- runFlow:
    file: ../../subflows/setup/create-extra-user.yaml
    env:
      PREFIX: STRANGER_
# One record per module, all owned by the family
- runFlow:
    file: ../../subflows/setup/create-account.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.FAMILY_ID}
      OWNER: FAMILY
      NAME: ${output.ACCOUNT_NAME}
- evalScript: ${output.FAMILY_ACCOUNT_ID = output.ACCOUNT_ID}
- runFlow:
    file: ../../subflows/setup/create-category.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.FAMILY_ID}
      OWNER: FAMILY
      NAME: ${output.CATEGORY_NAME}
      TYPE: EXPENSE
- evalScript: ${output.FAMILY_CATEGORY_ID = output.CATEGORY_ID}
- runFlow:
    file: ../../subflows/setup/create-transaction.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.FAMILY_ID}
      OWNER: FAMILY
      ACCOUNT_ID: ${output.FAMILY_ACCOUNT_ID}
      CATEGORY_ID: ${output.FAMILY_CATEGORY_ID}
      DESCRIPTION: ${output.TRANSACTION_NAME}
- runFlow:
    file: ../../subflows/setup/create-stock-item.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.FAMILY_ID}
      OWNER: FAMILY
      DESCRIPTION: ${output.ITEM_NAME}
# B sees all three records
- runFlow:
    file: ../../subflows/login.yaml
    env:
      EMAIL: ${output.MEMBER_EMAIL}
      PASSWORD: ${output.MEMBER_PASSWORD}
- runFlow: ../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.TRANSACTION_NAME}
    timeout: 20000
- tapOn:
    id: "financial.layout.segments-accounts"
- extendedWaitUntil:
    visible:
      id: "financial.accounts.row-title"
      text: ${output.ACCOUNT_NAME}
    timeout: 20000
- tapOn:
    id: "tab-stock"
- extendedWaitUntil:
    visible:
      id: "stock.list.row-title"
      text: ${output.ITEM_NAME}
    timeout: 20000
# Switch to the stranger C: a fresh app state, then the login form
- launchApp:
    clearState: true
- runFlow:
    file: ../../subflows/login.yaml
    env:
      EMAIL: ${output.STRANGER_EMAIL}
      PASSWORD: ${output.STRANGER_PASSWORD}
# C sees none of them (each module shows its empty state, never the records)
- runFlow: ../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.row-title"
    text: ${output.TRANSACTION_NAME}
- tapOn:
    id: "financial.layout.segments-accounts"
- extendedWaitUntil:
    visible:
      id: "financial.accounts.empty-state"
    timeout: 20000
- assertNotVisible:
    id: "financial.accounts.row-title"
    text: ${output.ACCOUNT_NAME}
- tapOn:
    id: "tab-stock"
- extendedWaitUntil:
    visible:
      id: "stock.list.empty-state"
    timeout: 20000
- assertNotVisible:
    id: "stock.list.row-title"
    text: ${output.ITEM_NAME}

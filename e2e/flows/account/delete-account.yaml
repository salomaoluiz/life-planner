url: ${E2E_WEB_URL}
name: account/delete-account
tags:
  - account
  - smoke
  - spec-024
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runFlow:
    file: ../../subflows/setup/create-transaction.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      DESCRIPTION: E2E Account Deletion
- runFlow:
    file: ../../subflows/setup/create-stock-item.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runFlow:
    file: ../../subflows/login.yaml
    env:
      EMAIL: ${output.EMAIL}
      PASSWORD: ${output.PASSWORD}
- runFlow: ../../subflows/account/open-settings.yaml
- tapOn:
    id: "settings.delete-account.button"
- extendedWaitUntil:
    visible:
      id: "settings.delete-account.confirm-dialog-confirm"
    timeout: 20000
- tapOn:
    id: "settings.delete-account.confirm-dialog-confirm"
- extendedWaitUntil:
    visible:
      id: "settings.delete-account.email-input"
    timeout: 20000
- tapOn:
    id: "settings.delete-account.email-input"
- inputText: ${output.EMAIL}
- tapOn:
    id: "settings.delete-account.submit-button"
- extendedWaitUntil:
    visible:
      id: "auth.login.account-deleted-notice"
    timeout: 20000
- runFlow:
    file: ../../subflows/assert/assert-login-fails.yaml
    env:
      EMAIL: ${output.EMAIL}
      PASSWORD: ${output.PASSWORD}
- runFlow:
    file: ../../subflows/assert/assert-token-rejected.yaml
    env:
      TOKEN: ${output.TOKEN}

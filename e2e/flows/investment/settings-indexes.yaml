url: ${E2E_WEB_URL}
name: investment/settings-indexes
tags:
  - investment
  - spec-113
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- extendedWaitUntil:
    visible:
      id: "home.home.screen"
    timeout: 20000
# Settings is the third section of the Investments side menu (spec 113 FR 20).
- tapOn:
    id: "tab-investments"
- extendedWaitUntil:
    visible:
      id: "navigation-rail-investment-settings"
    timeout: 20000
- tapOn:
    id: "navigation-rail-investment-settings"
- extendedWaitUntil:
    visible:
      id: "investment.settings.screen"
    timeout: 20000
# Before the first run of the job nothing is stored: the empty state fetches from the Central Bank (FR 25).
- runFlow:
    when:
      visible:
        id: "investment.settings.empty-fetch"
    commands:
      - tapOn:
          id: "investment.settings.empty-fetch"
- extendedWaitUntil:
    visible:
      id: "investment.settings.cdi-card"
    timeout: 90000
- assertVisible:
    id: "investment.settings.selic-card"
- assertVisible:
    id: "investment.settings.ipca-card"
# The source box is below the cards on a short window.
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- assertVisible:
    id: "investment.settings.source"
# The history of an index opens in a modal with the period pills and the changes table (FR 22).
- tapOn:
    id: "investment.settings.history.open-CDI"
- extendedWaitUntil:
    visible:
      id: "investment.settings.history.modal"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "investment.settings.history.period-12m"
    timeout: 20000
- tapOn:
    id: "investment.settings.history.period-5y"
- extendedWaitUntil:
    visible:
      id: "investment.settings.history.changes"
    timeout: 20000

url: ${E2E_WEB_URL}
name: investment/class-follows-ticker
tags:
  - investment
  - spec-111
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
# Spec 111 rules 11-13: picking a FII while the class is Ações moves the class to FIIs, says so, and saves a FII.
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/investment/open-investments.yaml
- extendedWaitUntil:
    visible:
      id: "investment.list.empty-state"
    timeout: 20000
- tapOn:
    id: "investment.list.add-button"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-input"
    timeout: 20000
- tapOn:
    id: "investment.asset-modal.ticker-input"
- inputText: "bthf11"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-suggestion-BTHF11.*"
    timeout: 30000
- tapOn:
    id: "investment.asset-modal.ticker-suggestion-BTHF11.*"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.class-notice"
    timeout: 10000
- tapOn:
    id: "investment.asset-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.list.group.BR_REIT-BRL"
    timeout: 20000
- assertNotVisible:
    id: "investment.list.group.BR_STOCK-BRL"

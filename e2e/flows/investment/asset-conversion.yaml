url: ${E2E_WEB_URL}
name: investment/asset-conversion
tags:
  - investment
  - spec-112
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
# Spec 112: 103 quotas of a FII (cost R$ 8.085,50) become 7,4 quotas of another FII each: 762 come in and the
# fraction of 0,2 waits for its auction sale. The origin is archived with a link; the destination shows where it came from.
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/setup/create-investment-asset.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      TICKER: KNRI11
      NAME: E2E Origin Fund
      ASSET_CLASS: BR_REIT
- evalScript: ${output.ORIGIN_ID = output.ASSET_ID}
- runFlow:
    file: ../../subflows/setup/create-investment-operation.yaml
    env:
      TOKEN: ${output.TOKEN}
      ASSET_ID: ${output.ORIGIN_ID}
      TYPE: BUY
      QUANTITY: "103"
      UNIT_PRICE: "78.5"
- runFlow:
    file: ../../subflows/setup/create-investment-asset.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      TICKER: HGLG11
      NAME: E2E Destination Fund
      ASSET_CLASS: BR_REIT
- evalScript: ${output.DESTINATION_ID = output.ASSET_ID}
- runFlow:
    file: ../../subflows/setup/create-investment-operation.yaml
    env:
      TOKEN: ${output.TOKEN}
      ASSET_ID: ${output.DESTINATION_ID}
      TYPE: BUY
      QUANTITY: "50"
      UNIT_PRICE: "10.2"
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/investment/open-investments.yaml
# The origin row sits below the destination: scroll the list to reach it.
- swipe:
    start: 60%, 80%
    end: 60%, 30%
- tapOn:
    id: "investment.list.row-${output.ORIGIN_ID}"
- extendedWaitUntil:
    visible:
      id: "investment.detail.screen"
    timeout: 20000
- tapOn:
    id: "investment.detail.actions-menu"
- tapOn:
    id: "investment.conversion.menu"
- extendedWaitUntil:
    visible:
      id: "investment.conversion.ratio-to"
    timeout: 20000
# The destination picker lists only the other FII of the same owner.
- tapOn:
    id: "investment.conversion.destination-picker"
- tapOn:
    id: "investment.conversion.destination-picker-option-${output.DESTINATION_ID}"
- tapOn:
    id: "investment.conversion.ratio-to"
- eraseText
- inputText: "7,4"
# The preview shows the position after: 812 quotas (50 + 762).
- extendedWaitUntil:
    visible:
      id: "investment.conversion.preview"
    timeout: 10000
- assertVisible: ".*812.*"
- tapOn:
    id: "investment.conversion.submit"
# The origin is archived, empty, and links to its destination.
- extendedWaitUntil:
    visible:
      id: "investment.conversion.banner-to"
    timeout: 20000
- assertVisible:
    id: "investment.detail.archive-banner"
- assertVisible:
    id: "investment.detail.quantity"
    text: ".*0.*"
# The destination holds the converted quotas, shows where they came from and waits for the fraction sale.
- tapOn: "Open HGLG11"
- extendedWaitUntil:
    visible:
      id: "investment.detail.screen"
    timeout: 20000
- assertVisible:
    id: "investment.detail.quantity"
    text: ".*812.*"
- assertVisible:
    id: "investment.conversion.banner-from-.*"
- assertVisible:
    id: "investment.fraction.pending"

url: ${E2E_WEB_URL}
name: investment/asset-class-from-ticker
tags:
  - investment
  - spec-111
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
# Spec 111: a B3 ticker brings its class, forcing the other class blocks Save, and an asset with operations can move
# between Ações and FIIs (a Fiagro has no class rule, so the API accepts the swap both ways).
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/setup/create-account.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: E2E Broker
      BALANCE_CENTS: "1000000"
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/investment/open-investments.yaml
- extendedWaitUntil:
    visible:
      id: "investment.list.empty-state"
    timeout: 20000
- tapOn:
    id: "investment.list.add-button"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-input"
    timeout: 20000
# The form starts as Ações; a FII ticker switches it and says so.
- tapOn:
    id: "investment.asset-modal.ticker-input"
- inputText: "knri"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-suggestion-KNRI11.*"
    timeout: 30000
- tapOn:
    id: "investment.asset-modal.ticker-suggestion-KNRI11.*"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.class-notice"
    timeout: 10000
# Picking the other B3 class by hand blocks Save and says why (spec 111 rule 14).
- tapOn:
    id: "investment.asset-modal.class"
- tapOn:
    id: "investment.asset-modal.class-option-BR_STOCK"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-error"
    timeout: 10000
- tapOn:
    id: "investment.asset-modal.save"
- assertVisible:
    id: "investment.asset-modal.ticker-error"
# Back to FIIs: the notice is gone and the asset saves under FIIs.
- tapOn:
    id: "investment.asset-modal.class"
- tapOn:
    id: "investment.asset-modal.class-option-BR_REIT"
- assertNotVisible:
    id: "investment.asset-modal.class-notice"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.quote-box"
    timeout: 10000
- tapOn:
    id: "investment.asset-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.list.group.BR_REIT-BRL"
    timeout: 20000
# A Fiagro has no class rule: it stays in Ações and gets no badge or notice.
- tapOn:
    id: "investment.list.add-button"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-input"
    timeout: 20000
- tapOn:
    id: "investment.asset-modal.ticker-input"
- inputText: "rzag"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-suggestion-RZAG11.*"
    timeout: 30000
- tapOn:
    id: "investment.asset-modal.ticker-suggestion-RZAG11.*"
- assertNotVisible:
    id: "investment.asset-modal.class-notice"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.quote-box"
    timeout: 10000
- tapOn:
    id: "investment.asset-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.list.group.BR_STOCK-BRL"
    timeout: 20000
# One operation, then the class moves to FIIs through the confirmation.
- swipe:
    start: 50%, 80%
    end: 50%, 55%
- tapOn:
    text: ".*RZAG11.*"
- extendedWaitUntil:
    visible:
      id: "investment.detail.screen"
    timeout: 20000
- tapOn:
    id: "investment.detail.add-operation"
- extendedWaitUntil:
    visible:
      id: "investment.operation-modal.quantity"
    timeout: 20000
- tapOn:
    id: "investment.operation-modal.quantity"
- inputText: "10"
- tapOn:
    id: "investment.operation-modal.unit-price"
- inputText: "100"
- tapOn:
    id: "investment.operation-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.detail.quantity"
      text: ".*10.*"
    timeout: 20000
- tapOn:
    id: "investment.detail.actions-menu"
- tapOn:
    id: "investment.detail.menu-edit"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.class"
    timeout: 20000
- tapOn:
    id: "investment.asset-modal.class"
- tapOn:
    id: "investment.asset-modal.class-option-BR_REIT"
- tapOn:
    id: "investment.asset-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.class-confirm"
    timeout: 10000
- tapOn:
    id: "investment.asset-modal.class-confirm-confirm"
- extendedWaitUntil:
    visible:
      id: "investment.detail.screen"
    timeout: 20000
- tapOn:
    id: "investment.detail.back"
- extendedWaitUntil:
    visible:
      id: "investment.list.group.BR_REIT-BRL"
    timeout: 20000
- assertVisible:
    text: ".*RZAG11.*"

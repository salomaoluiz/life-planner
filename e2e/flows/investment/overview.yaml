url: ${E2E_WEB_URL}
name: investment/overview
tags:
  - investment
  - spec-110
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
# One bought asset, so the overview has a position to show.
- runFlow:
    file: ../../subflows/setup/create-investment-asset.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      TICKER: E2ETK3
      NAME: E2E Asset
- runFlow:
    file: ../../subflows/setup/create-investment-operation.yaml
    env:
      TOKEN: ${output.TOKEN}
      ASSET_ID: ${output.ASSET_ID}
      TYPE: BUY
      QUANTITY: "100"
      UNIT_PRICE: "10"
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
# Opening Investimentos lands on the overview (spec 110 FR 1).
- tapOn:
    id: "tab-investments"
- extendedWaitUntil:
    visible:
      id: "investment.overview.screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "investment.overview.tile-current-value"
    timeout: 20000
- assertVisible:
    id: "investment.overview.tile-invested"
- assertVisible:
    id: "investment.overview.tile-open-result"
# The period moves to 3M and never goes to the future.
- tapOn: "3M"
- assertVisible:
    id: "investment.overview.period-range"
# The blocks are below the tiles: swipe the page (scrollUntilVisible does not scroll it on web).
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible:
      id: "investment.overview.evolution-title"
    timeout: 20000
# Filtering by class is screen state; clearing restores the ranking.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible:
      id: "investment.overview.allocation-class-PRIVATE"
    timeout: 20000
- tapOn:
    id: "investment.overview.allocation-class-PRIVATE"
- extendedWaitUntil:
    visible:
      id: "investment.overview.ranking-filter-clear"
    timeout: 20000
- tapOn:
    id: "investment.overview.ranking-filter-clear"
- assertNotVisible:
    id: "investment.overview.ranking-filter-clear"
- extendedWaitUntil:
    visible:
      id: "investment.overview.ranking-row-${output.ASSET_ID}"
    timeout: 20000
# The income block closes the page.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible:
      id: "investment.overview.income-title"
    timeout: 20000
# Back to the top, then Assets keeps the 102 list.
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- extendedWaitUntil:
    visible:
      id: "investment.sections.assets"
    timeout: 20000
- tapOn:
    id: "investment.sections.assets"
- extendedWaitUntil:
    visible:
      id: "investment.list.screen"
    timeout: 20000
- tapOn:
    id: "investment.sections.overview"
- extendedWaitUntil:
    visible:
      id: "investment.overview.screen"
    timeout: 20000

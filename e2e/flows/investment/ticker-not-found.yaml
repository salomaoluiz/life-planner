url: ${E2E_WEB_URL}
name: investment/ticker-not-found
tags:
  - investment
  - spec-104
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
# Spec 104 FR 24: a quoted-class ticker that was typed but not picked from the search blocks saving.
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/investment/open-investments.yaml
- extendedWaitUntil:
    visible:
      id: "investment.list.empty-state"
    timeout: 20000
- tapOn:
    id: "investment.list.add-button"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker"
    timeout: 20000
- tapOn:
    id: "investment.asset-modal.ticker"
- inputText: "XYZW9"
- tapOn:
    id: "investment.asset-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-error"
    timeout: 10000
# The form stays open and nothing was created.
- assertVisible:
    id: "investment.asset-modal.save"

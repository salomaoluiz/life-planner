url: ${E2E_WEB_URL}
name: investment/empty-and-create-asset
tags:
  - investment
  - spec-102
  - spec-104
  - smoke
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/investment/open-investments.yaml
- extendedWaitUntil:
    visible:
      id: "investment.list.empty-state"
    timeout: 20000
- tapOn:
    id: "investment.list.add-button"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-input"
    timeout: 20000
# Saving with the ticker missing keeps the form open and says why.
- tapOn:
    id: "investment.asset-modal.save"
- assertVisible:
    id: "investment.asset-modal.ticker-error"
# Spec 104: a quoted class only saves a ticker picked from the market search.
- tapOn:
    id: "investment.asset-modal.ticker-input"
- inputText: "itsa"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.ticker-suggestion-ITSA4.*"
    timeout: 30000
- tapOn:
    id: "investment.asset-modal.ticker-suggestion-ITSA4.*"
- extendedWaitUntil:
    visible:
      id: "investment.asset-modal.quote-box"
    timeout: 10000
- tapOn:
    id: "investment.asset-modal.save"
- extendedWaitUntil:
    visible:
      id: "investment.list.group.BR_STOCK-BRL"
    timeout: 20000
- assertNotVisible:
    id: "investment.list.empty-state"

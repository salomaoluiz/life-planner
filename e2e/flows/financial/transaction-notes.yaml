url: ${E2E_WEB_URL}
name: financial/transaction-notes
tags:
  - financial
  - spec-059
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: E2E Noted
      KEY: ROW_NAME
- runScript:
    file: ../../scripts/random-name.js
    env:
      PREFIX: Aeroporto
      KEY: NOTE_WORD
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.amount-input"
    timeout: 20000
# Create with a note
- tapOn:
    id: "financial.transaction-form.amount-input"
- eraseText
- inputText: "3870"
- tapOn:
    id: "financial.transaction-form.description-input"
- inputText: ${output.ROW_NAME}
- tapOn:
    id: "financial.transaction-form.category-${output.EXPENSE_CATEGORY_ID}"
- tapOn:
    id: "financial.transaction-form.account-select"
- tapOn:
    id: "financial.transaction-form.account-select-option-${output.ACCOUNT_ID}"
# The notes are the last field of the left column: scroll the form to reach them
- runFlow: ../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.transactionForm.notesInput"
- inputText: ${output.NOTE_WORD}
- tapOn:
    id: "financial.transaction-form.save-button"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.ROW_NAME}
    timeout: 20000
# The row shows the note icon
- assertVisible:
    id: "financial.transactions.rowNoteIcon"
# The search finds the row by a word of the note (it is not in the description)
- runFlow: ../../subflows/financial/scroll-list-up.yaml
- tapOn:
    id: "financial.transactions.search"
- inputText: ${output.NOTE_WORD}
- extendedWaitUntil:
    visible:
      id: "financial.transactions.filtered-summary"
    timeout: 20000
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- assertVisible:
    id: "financial.transactions.row-title"
    text: ${output.ROW_NAME}
# ... by the category name
- runFlow: ../../subflows/financial/scroll-list-up.yaml
- tapOn:
    id: "financial.transactions.search"
- eraseText
- inputText: ${output.EXPENSE_CATEGORY_NAME}
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.ROW_NAME}
    timeout: 20000
# ... and a word that matches nothing hides it
- runFlow: ../../subflows/financial/scroll-list-up.yaml
- tapOn:
    id: "financial.transactions.search"
- eraseText
- inputText: "zzzznomatch"
- extendedWaitUntil:
    notVisible:
      id: "financial.transactions.row-title"
      text: ${output.ROW_NAME}
    timeout: 20000
# Clear the note: the icon is gone
- runFlow: ../../subflows/financial/scroll-list-up.yaml
- tapOn:
    id: "financial.transactions.search"
- eraseText
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.ROW_NAME}
    timeout: 20000
- tapOn:
    id: "financial.transactions.row-title"
    text: ${output.ROW_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.transactionForm.notesInput"
    timeout: 20000
- runFlow: ../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.transactionForm.notesInput"
- eraseText: 100
- tapOn:
    id: "financial.transaction-form.save-button"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.ROW_NAME}
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.rowNoteIcon"

url: ${E2E_WEB_URL}
name: financial/transaction-form-wide-layout
tags:
  - financial
  - spec-037
onFlowComplete:
  - runFlow: ../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runFlow:
    file: ../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- runFlow: ../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.sheet"
    timeout: 20000
# the web window is wide: two columns, and the owner chips and Save need no scrolling
- assertVisible:
    id: "financial.transaction-form.sheet-column-left"
- assertVisible:
    id: "financial.transaction-form.sheet-column-right"
- assertVisible:
    id: "financial.transaction-form.owner-${output.USER_ID}"
- assertVisible:
    id: "financial.transaction-form.save-button"

url: ${E2E_WEB_URL}
name: financial/credit-cards/purchases-and-payment
tags:
  - financial
  - spec-029
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- evalScript: ${output.KEEP_ACCOUNT_ID = output.ACCOUNT_ID}
- evalScript: ${output.KEEP_CATEGORY_ID = output.EXPENSE_CATEGORY_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Card
      KEY: CARD_TITLE
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Market
      KEY: PURCHASE_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Fuel
      KEY: NEW_PURCHASE_NAME
# A card whose last invoice closed yesterday (CLOSED, listed today) with one purchase of 250,00
- runFlow:
    file: ../../../subflows/setup/create-card-purchase.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      CATEGORY_ID: ${output.KEEP_CATEGORY_ID}
      TITLE: ${output.CARD_TITLE}
      DESCRIPTION: ${output.PURCHASE_NAME}
      VALUE_CENTS: "25000"
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- extendedWaitUntil:
    visible:
      id: "home.home.screen"
    timeout: 20000
# Add a purchase in the app with Pay with = Card (it goes to the next invoice)
- tapOn:
    id: "quick-add-button|navigation-rail-add"
- extendedWaitUntil:
    visible:
      id: "quick-add-transaction"
    timeout: 20000
- tapOn:
    id: "quick-add-transaction"
- extendedWaitUntil:
    visible:
      id: "financial.transactionForm.payWith"
    timeout: 20000
- tapOn:
    id: "financial.transactionForm.payWith-CARD"
- assertNotVisible:
    id: "financial.transaction-form.type"
- assertVisible:
    id: "financial.transaction-form.invoice-hint"
- tapOn:
    id: "financial.transaction-form.amount-input"
- eraseText
- inputText: "1000"
- tapOn:
    id: "financial.transaction-form.description-input"
- inputText: ${output.NEW_PURCHASE_NAME}
- tapOn:
    id: "financial.transaction-form.category-${output.KEEP_CATEGORY_ID}"
- tapOn:
    id: "financial.transaction-form.save-button"
# The closed invoice is ONE line in the list today, with its subtotal in the month summary
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.summary-expense"
      text: ".*250[.,]00.*"
    timeout: 20000
# The month summary and the last-day balance header (spec 035) push the invoice line below the fold
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.cardInvoice.row"
    timeout: 20000
- assertVisible:
    id: "financial.transactions.cardInvoice.amount"
    text: ".*250[.,]00.*"
# The purchase made in the app is not an account row
- assertNotVisible:
    id: "financial.transactions.row-title"
    text: ${output.NEW_PURCHASE_NAME}
# The header is tall: scroll the list to the invoice line, expand it, scroll to its purchases
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.cardInvoice.toggle"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.cardInvoice.purchase-title"
      text: ${output.PURCHASE_NAME}
    timeout: 20000
# Open the invoice and pay it from the account
- tapOn:
    id: "financial.transactions.cardInvoice.open"
- extendedWaitUntil:
    visible:
      id: "financial.invoice.pay"
    timeout: 20000
- tapOn:
    id: "financial.invoice.pay"
- extendedWaitUntil:
    visible:
      id: "financial.invoice.pay-account"
    timeout: 20000
- tapOn:
    id: "financial.invoice.pay-account"
- tapOn:
    id: "financial.invoice.pay-account-option-${output.KEEP_ACCOUNT_ID}"
- tapOn:
    id: "financial.invoice.pay-confirm"
- extendedWaitUntil:
    visible:
      id: "financial.invoice.paid-info"
    timeout: 20000
- tapOn:
    id: "financial.invoice.screen-close"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.cardInvoice.paid-info"
    timeout: 20000
# The account balance dropped by the invoice amount (0,00 - 250,00)
- tapOn:
    id: "financial.layout.segments-accounts"
- extendedWaitUntil:
    visible:
      id: "financial.accounts.row-balance"
      text: ".*250[.,]00.*"
    timeout: 20000
# Undo the payment: the invoice is payable again
- tapOn:
    id: "financial.layout.segments-transactions"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.cardInvoice.row"
    timeout: 20000
- tapOn:
    id: "financial.transactions.cardInvoice.toggle"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.cardInvoice.open"
- extendedWaitUntil:
    visible:
      id: "financial.invoice.undo"
    timeout: 20000
- tapOn:
    id: "financial.invoice.undo"
- tapOn:
    id: "financial.invoice.undo-confirm-confirm"
- extendedWaitUntil:
    visible:
      id: "financial.invoice.pay"
    timeout: 20000

url: ${E2E_WEB_URL}
name: financial/categories/archive-category
tags:
  - financial
  - spec-041
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-categories.yaml
- tapOn:
    id: "financial.categories.row-title"
    text: ${output.EXPENSE_CATEGORY_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.category-form.name-input"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.category-form.archive-button"
- extendedWaitUntil:
    visible:
      id: "financial.category-form.archive-dialog-confirm"
    timeout: 20000
- tapOn:
    id: "financial.category-form.archive-dialog-confirm"
# Archived: out of the active list, inside the collapsed "Archived (N)" group
- extendedWaitUntil:
    visible:
      id: "financial.categories.archived-toggle"
    timeout: 20000
- assertNotVisible:
    id: "financial.categories.row-title"
    text: ${output.EXPENSE_CATEGORY_NAME}
- tapOn:
    id: "financial.categories.archived-toggle"
- extendedWaitUntil:
    visible:
      id: "financial.categories.row-title"
      text: ${output.EXPENSE_CATEGORY_NAME}
    timeout: 20000
# The only expense category is archived: a new expense has none to pick
- tapOn:
    id: "navigation-rail-financial-transactions"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.missing-category-hint"
    timeout: 20000
- assertNotVisible:
    id: "financial.transaction-form.category-${output.EXPENSE_CATEGORY_ID}"
- tapOn:
    id: "financial.transaction-form.sheet-close"
# Reactivate it: back in the active list, and the group is gone
- tapOn:
    id: "navigation-rail-financial-categories"
- extendedWaitUntil:
    visible:
      id: "financial.categories.archived-toggle"
    timeout: 20000
- tapOn:
    id: "financial.categories.archived-toggle"
- tapOn:
    id: "financial.categories.row-title"
    text: ${output.EXPENSE_CATEGORY_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.category-form.name-input"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.category-form.reactivate-button"
- extendedWaitUntil:
    notVisible:
      id: "financial.categories.archived-toggle"
    timeout: 20000
- assertVisible:
    id: "financial.categories.row-title"
    text: ${output.EXPENSE_CATEGORY_NAME}

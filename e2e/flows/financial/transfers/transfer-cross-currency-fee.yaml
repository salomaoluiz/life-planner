url: ${E2E_WEB_URL}
name: financial/transfers/transfer-cross-currency-fee
tags:
  - financial
  - spec-098
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- evalScript: ${output.FROM_ACCOUNT_ID = output.ACCOUNT_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Destination
      KEY: TO_ACCOUNT_NAME
- runFlow:
    file: ../../../subflows/setup/create-account.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: ${output.TO_ACCOUNT_NAME}
      CURRENCY: USD
- evalScript: ${output.TO_ACCOUNT_ID = output.ACCOUNT_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Transfer
      KEY: TRANSFER_NAME
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.type"
    timeout: 20000
- tapOn:
    id: "financial.transaction-form.type-TRANSFER"
- extendedWaitUntil:
    visible:
      id: "financial.transfer-form.description"
    timeout: 20000
- tapOn:
    id: "financial.transfer-form.description"
- inputText: ${output.TRANSFER_NAME}
- tapOn:
    id: "financial.transfer-form.from"
- tapOn:
    id: "financial.transfer-form.from-option-${output.FROM_ACCOUNT_ID}"
- tapOn:
    id: "financial.transfer-form.amount-out"
- eraseText
- inputText: "500000"
- tapOn:
    id: "financial.transfer-form.to"
- tapOn:
    id: "financial.transfer-form.to-option-${output.TO_ACCOUNT_ID}"
# Between currencies the amount in is typed and the rate is derived
- extendedWaitUntil:
    visible:
      id: "financial.transfer-form.amount-in"
    timeout: 20000
- tapOn:
    id: "financial.transfer-form.amount-in"
- eraseText
- inputText: "92000"
- assertVisible:
    id: "financial.transfer-form.rate-text"
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.transfer-form.fee"
- eraseText
- inputText: "350"
- tapOn:
    id: "financial.transfer-form.save-button"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.TRANSFER_NAME}
    timeout: 20000
# The in row shows the rate AND the fee counts in the month expenses
- assertVisible:
    id: "financial.transactions.row.transfer-rate"
- assertVisible:
    id: "financial.transactions.summary-expense"
    text: ".*3[.,]50.*"

url: ${E2E_WEB_URL}
name: financial/splits/split-delete
tags:
  - financial
  - spec-119
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Split
      KEY: SPLIT_NAME
- runFlow:
    file: ../../../subflows/setup/create-split.yaml
    env:
      TOKEN: ${output.TOKEN}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      DESCRIPTION: ${output.SPLIT_NAME}
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.split.title"
      text: ${output.SPLIT_NAME}
    timeout: 20000
- tapOn:
    id: "financial.transactions.split.toggle"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.split.delete"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.split.delete-dialog-confirm"
    timeout: 20000
- tapOn:
    id: "financial.transactions.split.delete-dialog-confirm"
# Deleting removes the header and every part: the month is empty again
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.split.title"

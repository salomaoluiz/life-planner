url: ${E2E_WEB_URL}
name: financial/accounts/archive-account
tags:
  - financial
  - spec-013
  - spec-023
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Account
      KEY: ACCOUNT_NAME
- runFlow:
    file: ../../../subflows/setup/create-account.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: ${output.ACCOUNT_NAME}
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-accounts.yaml
- tapOn:
    id: "financial.accounts.row-title"
    text: ${output.ACCOUNT_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.account-form.name-input"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.account-form.archived-switch"
- tapOn:
    id: "financial.account-form.save-button"
- extendedWaitUntil:
    visible:
      id: "financial.accounts.archived-toggle"
    timeout: 20000
- assertNotVisible:
    id: "financial.accounts.row-title"
    text: ${output.ACCOUNT_NAME}
- tapOn:
    id: "financial.accounts.archived-toggle"
- extendedWaitUntil:
    visible:
      id: "financial.accounts.row-title"
      text: ${output.ACCOUNT_NAME}
    timeout: 20000
# Reopen right after the change: the form must show the saved status (spec 023).
- tapOn:
    id: "financial.accounts.row-title"
    text: ${output.ACCOUNT_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.account-form.name-input"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
# Maestro web cannot read the switch state. If the form showed OFF (stale), this tap would
# turn it ON, the save would send no change, and the account would stay archived below.
- tapOn:
    id: "financial.account-form.archived-switch"
- tapOn:
    id: "financial.account-form.save-button"
- extendedWaitUntil:
    visible:
      id: "financial.accounts.row-title"
      text: ${output.ACCOUNT_NAME}
    timeout: 20000
- assertNotVisible:
    id: "financial.accounts.archived-toggle"

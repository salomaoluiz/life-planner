url: ${E2E_WEB_URL}
name: financial/transactions/instant-two-in-a-row
tags:
  - financial
  - spec-061
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
# Regression: two creates (or deletes) in a row. The screen regaining focus when the second modal closes refetches
# the lists and cancels the refetch of the first change; the first one then lost its Saving/Deleting state before the
# fresh data landed (the created row vanished, the deleted one looked normal) until the API answered.
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E First
      KEY: FIRST_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Second
      KEY: SECOND_NAME
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
# Two creates back to back: no waiting for the first one to be confirmed
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- runFlow:
    file: ../../../subflows/financial/fill-and-save-expense.yaml
    env:
      AMOUNT: "10000"
      NAME: ${output.FIRST_NAME}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
- extendedWaitUntil:
    visible:
      id: "financial.transactions.fab"
    timeout: 20000
- tapOn:
    id: "financial.transactions.fab"
- runFlow:
    file: ../../../subflows/financial/fill-and-save-expense.yaml
    env:
      AMOUNT: "20000"
      NAME: ${output.SECOND_NAME}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
# The first row must still be listed (saving or saved) once the second modal closed
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.SECOND_NAME}
    timeout: 20000
- assertVisible:
    id: "financial.transactions.row-title"
    text: ${output.FIRST_NAME}
- extendedWaitUntil:
    notVisible:
      id: "financial.transactions.pendingChip"
    timeout: 20000
- assertVisible:
    id: "financial.transactions.row-title"
    text: ${output.FIRST_NAME}
- assertVisible:
    id: "financial.transactions.summary-expense"
    text: ".*300[.,]00.*"
# Two deletes back to back
- tapOn:
    id: "financial.transactions.row-title"
    text: ${output.FIRST_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.description-input"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.transaction-form.delete-button"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.delete-dialog-confirm"
    timeout: 20000
- tapOn:
    id: "financial.transaction-form.delete-dialog-confirm"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.SECOND_NAME}
    timeout: 20000
- tapOn:
    id: "financial.transactions.row-title"
    text: ${output.SECOND_NAME}
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.description-input"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.transaction-form.delete-button"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.delete-dialog-confirm"
    timeout: 20000
- tapOn:
    id: "financial.transaction-form.delete-dialog-confirm"
# Both rows are still on screen as Deleting until the API answers; then the month is empty
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.row-title"
- assertNotVisible:
    id: "financial.transactions.pendingChip"

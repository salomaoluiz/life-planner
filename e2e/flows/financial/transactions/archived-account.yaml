url: ${E2E_WEB_URL}
name: financial/transactions/archived-account
tags:
  - financial
  - spec-028
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Account
      KEY: ACCOUNT_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Category
      KEY: CATEGORY_NAME
# the only account is archived; a category exists so only the account hint can show
- runFlow:
    file: ../../../subflows/setup/create-account.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: ${output.ACCOUNT_NAME}
      STATUS: ARCHIVED
- runFlow:
    file: ../../../subflows/setup/create-category.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: ${output.CATEGORY_NAME}
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.sheet"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
# an archived account is not offered: the form asks to create an account
- assertVisible:
    id: "financial.transaction-form.missing-account-hint"

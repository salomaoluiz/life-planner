url: ${E2E_WEB_URL}
name: financial/transactions/save-and-new
tags:
  - financial
  - spec-039
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E First
      KEY: FIRST_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Second
      KEY: SECOND_NAME
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
# The header is taller since spec 025: scroll the list to reach the action
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.amount-input"
    timeout: 20000
- tapOn:
    id: "financial.transaction-form.amount-input"
- eraseText
- inputText: "1000"
- tapOn:
    id: "financial.transaction-form.description-input"
- inputText: ${output.FIRST_NAME}
- tapOn:
    id: "financial.transaction-form.category-${output.EXPENSE_CATEGORY_ID}"
# Save and add another keeps the modal open and shows the notice
- tapOn:
    id: "financial.transaction-form.save-and-new-button"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.saved-toast"
    timeout: 20000
- assertVisible:
    id: "financial.transaction-form.sheet"
# Amount and description are cleared
- assertVisible:
    id: "financial.transaction-form.amount-input"
    text: ".*0[.,]00.*"
- assertNotVisible:
    text: ${output.FIRST_NAME}
# An empty amount is still validated and nothing is saved
- tapOn:
    id: "financial.transaction-form.save-and-new-button"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.amount-input-error"
    timeout: 20000
# The category and owner were kept: the second entry needs only amount and description
- tapOn:
    id: "financial.transaction-form.amount-input"
- eraseText
- inputText: "2000"
- tapOn:
    id: "financial.transaction-form.description-input"
- inputText: ${output.SECOND_NAME}
- tapOn:
    id: "financial.transaction-form.save-button"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.SECOND_NAME}
    timeout: 20000
- assertVisible:
    id: "financial.transactions.row-title"
    text: ${output.FIRST_NAME}

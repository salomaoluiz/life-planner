url: ${E2E_WEB_URL}
name: financial/transactions/filters-category-period
tags:
  - financial
  - spec-045
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Other Category
      KEY: OTHER_CATEGORY_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Match Row
      KEY: MATCH_ROW_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Other Row
      KEY: OTHER_ROW_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Match Purchase
      KEY: MATCH_PURCHASE_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Other Purchase
      KEY: OTHER_PURCHASE_NAME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Card
      KEY: CARD_TITLE
- runFlow:
    file: ../../../subflows/setup/create-category.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: ${output.OTHER_CATEGORY_NAME}
      TYPE: EXPENSE
- evalScript: ${output.OTHER_CATEGORY_ID = output.CATEGORY_ID}
# Two account rows (one per category) and one invoice with a purchase of each category
- runFlow:
    file: ../../../subflows/setup/create-transaction.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      DESCRIPTION: ${output.MATCH_ROW_NAME}
      VALUE_CENTS: "1100"
- runFlow:
    file: ../../../subflows/setup/create-transaction.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
      CATEGORY_ID: ${output.OTHER_CATEGORY_ID}
      DESCRIPTION: ${output.OTHER_ROW_NAME}
      VALUE_CENTS: "2200"
- runFlow:
    file: ../../../subflows/setup/create-card-purchase.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      TITLE: ${output.CARD_TITLE}
      DESCRIPTION: ${output.MATCH_PURCHASE_NAME}
      VALUE_CENTS: "3300"
      SECOND_CATEGORY_ID: ${output.OTHER_CATEGORY_ID}
      SECOND_DESCRIPTION: ${output.OTHER_PURCHASE_NAME}
      SECOND_VALUE_CENTS: "4400"
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.OTHER_ROW_NAME}
    timeout: 20000
# Filter: the first category, this year
- runFlow: ../../../subflows/financial/scroll-list-up.yaml
- tapOn:
    id: "financial.transactions.filters-button"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.filters.apply"
    timeout: 20000
- tapOn:
    id: "financial.transactions.filters.period-mode-THIS_YEAR"
- tapOn:
    id: "financial.transactions.filters.category-${output.EXPENSE_CATEGORY_ID}"
- tapOn:
    id: "financial.transactions.filters.apply"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.filtered-summary"
    timeout: 20000
- assertVisible:
    id: "financial.transactions.period-chip"
- assertVisible:
    id: "financial.transactions.filters-button-badge"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- assertVisible:
    id: "financial.transactions.row-title"
    text: ${output.MATCH_ROW_NAME}
- assertNotVisible:
    id: "financial.transactions.row-title"
    text: ${output.OTHER_ROW_NAME}
# The invoice stays in the list but only with the matching purchase: "1 of 2 purchases match"
- assertVisible:
    id: "financial.transactions.cardInvoice.match"
- tapOn:
    id: "financial.transactions.cardInvoice.toggle"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.cardInvoice.purchase-title"
      text: ${output.MATCH_PURCHASE_NAME}
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.cardInvoice.purchase-title"
    text: ${output.OTHER_PURCHASE_NAME}
# Removing the category chip brings the other rows back
- runFlow: ../../../subflows/financial/scroll-list-up.yaml
- tapOn:
    id: "financial.transactions.active-filter-categories-remove"
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.OTHER_ROW_NAME}
    timeout: 20000

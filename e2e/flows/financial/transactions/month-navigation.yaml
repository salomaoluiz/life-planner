url: ${E2E_WEB_URL}
name: financial/transactions/month-navigation
tags:
  - financial
  - spec-013
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Transaction
      KEY: TRANSACTION_NAME
- runFlow:
    file: ../../../subflows/setup/create-transaction.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      ACCOUNT_ID: ${output.ACCOUNT_ID}
      CATEGORY_ID: ${output.EXPENSE_CATEGORY_ID}
      DESCRIPTION: ${output.TRANSACTION_NAME}
      VALUE_CENTS: "9900"
      MONTHS_AGO: "1"
- runFlow:
    file: ../../../subflows/login.yaml
    env:
      EMAIL: ${output.EMAIL}
      PASSWORD: ${output.PASSWORD}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.row-title"
- tapOn:
    id: "financial.transactions.month-previous"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-title"
      text: ${output.TRANSACTION_NAME}
    timeout: 20000
- assertNotVisible:
    id: "financial.transactions.empty-month"
- tapOn:
    id: "financial.transactions.month-next"
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- assertVisible:
    id: "financial.transactions.summary-expense"
    text: ".*0[.,]00.*"
- assertNotVisible:
    id: "financial.transactions.summary-expense"
    text: ".*99[.,]00.*"

url: ${E2E_WEB_URL}
name: financial/transactions/recurring-no-end
tags:
  - financial
  - spec-034
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Series
      KEY: SERIES_NAME
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow: ../../../subflows/financial/open-transactions.yaml
- extendedWaitUntil:
    visible:
      id: "financial.transactions.empty-month"
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- tapOn:
    id: "financial.transactions.empty-month-action"
- extendedWaitUntil:
    visible:
      id: "financial.transaction-form.amount-input"
    timeout: 20000
- tapOn:
    id: "financial.transaction-form.amount-input"
- eraseText
- inputText: "15000"
- tapOn:
    id: "financial.transaction-form.description-input"
- inputText: ${output.SERIES_NAME}
- tapOn:
    id: "financial.transaction-form.category-${output.EXPENSE_CATEGORY_ID}"
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
# Repeat weekly with no end date: the preview says it repeats forever
- tapOn:
    id: "financial.transaction-form.repeat"
- tapOn:
    id: "financial.transaction-form.repeat-frequency-WEEKLY"
- assertVisible:
    id: "financial.transaction-form.repeat-preview"
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.transaction-form.account-select"
- tapOn:
    id: "financial.transaction-form.account-select-option-${output.ACCOUNT_ID}"
- tapOn:
    id: "financial.transaction-form.save-button"
# The rows show the repeat icon and no counter: the title is exactly the description
- extendedWaitUntil:
    visible:
      id: "financial.transactions.row-recurring-title"
      text: ${output.SERIES_NAME}
    timeout: 20000
- runFlow: ../../../subflows/financial/scroll-list-down.yaml
- assertVisible:
    id: "financial.transactions.row.repeat"

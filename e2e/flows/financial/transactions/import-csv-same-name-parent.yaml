url: ${E2E_WEB_URL}
name: financial/transactions/import-csv-same-name-parent
tags:
  - financial
  - spec-054
onFlowComplete:
  - runFlow: ../../../subflows/cleanup/delete-e2e-users.yaml
---
# Spec 054 FR 1-3: an expense and an income "Casa" exist; the path "Casa > child" of an income row is created under the
# income one (before the fix the level was matched ignoring the type and the value stayed without a match).
- launchApp:
    clearState: true
- runFlow: ../../../subflows/signup-via-api.yaml
- runFlow:
    file: ../../../subflows/setup/finance-basics.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
- runFlow:
    file: ../../../subflows/setup/create-category.yaml
    env:
      TOKEN: ${output.TOKEN}
      OWNER_ID: ${output.USER_ID}
      NAME: ${output.EXPENSE_CATEGORY_NAME}
      TYPE: INCOME
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Import Row A
      KEY: ROW_A
- runScript:
    file: ../../../scripts/random-name.js
    env:
      PREFIX: E2E Import Row B
      KEY: ROW_B
- evalScript: ${output.NEW_CATEGORY_NAME = output.EXPENSE_CATEGORY_NAME + ' > E2E Import Child'}
- runScript:
    file: ../../../scripts/csv-import-fixture.js
    env:
      DESCRIPTION_1: ${output.ROW_A}
      DESCRIPTION_2: ${output.ROW_B}
      CATEGORY_1: ${output.EXPENSE_CATEGORY_NAME}
      CATEGORY_2: ${output.NEW_CATEGORY_NAME}
      AMOUNT_2: "500,00"
      ACCOUNT_NAME: ${output.ACCOUNT_NAME}
- runFlow:
    file: ../../../subflows/login-by-token.yaml
    env:
      TOKEN: ${output.TOKEN}
      REFRESH_TOKEN: ${output.REFRESH_TOKEN}
- runFlow:
    file: ../../../subflows/financial/load-csv-fixture.yaml
    env:
      CSV_FRAGMENT: ${output.CSV_FRAGMENT}
- runFlow: ../../../subflows/financial/open-transactions.yaml
# Spec 050: the CSV actions live in the ⋮ menu
- tapOn:
    id: "financial.transactions.moreActions"
- tapOn:
    id: "financial.transactions.importButton"
- tapOn:
    id: "financial.import.file.pick"
- extendedWaitUntil:
    visible:
      id: "financial.import.file.name"
    timeout: 20000
- tapOn:
    id: "financial.import.continue"
- extendedWaitUntil:
    visible:
      id: "financial.import.column.0"
    timeout: 20000
- tapOn:
    id: "financial.import.continue"
# Step 3: the income path has no match: create it; it must land under the income category and match the value.
- extendedWaitUntil:
    visible:
      id: "financial.import.value.category.1"
    timeout: 20000
- tapOn:
    id: "financial.import.value.category.1"
- tapOn:
    id: "financial.import.value.category.1-option-__create__"
# The new category form is on the right: its buttons are below the fold of the wizard.
- runFlow: ../../../subflows/financial/scroll-form-down.yaml
- tapOn:
    id: "financial.import.create.submit"
- extendedWaitUntil:
    visible:
      id: "financial.import.value.category.1-value"
      text: ${output.NEW_CATEGORY_NAME}
    timeout: 20000
- assertNotVisible:
    id: "financial.import.create.error"
- tapOn:
    id: "financial.import.continue"
# Step 4: both rows are ready.
- extendedWaitUntil:
    visible:
      id: "financial.import.row.2"
    timeout: 20000
- assertVisible:
    id: "financial.import.row.3"
- tapOn:
    id: "financial.import.submit"
- extendedWaitUntil:
    visible:
      id: "financial.import.toast"
    timeout: 20000
- assertVisible:
    id: "financial.transactions.summary-income"
    text: ".*500[.,]00.*"

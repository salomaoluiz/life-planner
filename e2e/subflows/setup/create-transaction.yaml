url: ${E2E_WEB_URL}
env:
  DESCRIPTION: E2E transaction
  VALUE_CENTS: "1000"
  DATE: ""
  TYPE: EXPENSE
  OWNER: USER
---
- runScript:
    file: ../../scripts/setup/create-transaction.js
    env:
      TOKEN: ${TOKEN}
      OWNER_ID: ${OWNER_ID}
      ACCOUNT_ID: ${ACCOUNT_ID}
      CATEGORY_ID: ${CATEGORY_ID}
      DESCRIPTION: ${DESCRIPTION}
      VALUE_CENTS: ${VALUE_CENTS}
      DATE: ${DATE}
      TYPE: ${TYPE}
      OWNER: ${OWNER}

url: ${E2E_WEB_URL}
---
# Optional caller-scoped params are read by the script (Maestro ignores caller values for header defaults):
# DESCRIPTION, VALUE_CENTS, DATE, MONTHS_AGO, TYPE, OWNER.
- runScript:
    file: ../../scripts/setup/create-transaction.js
    env:
      TOKEN: ${TOKEN}
      OWNER_ID: ${OWNER_ID}
      ACCOUNT_ID: ${ACCOUNT_ID}
      CATEGORY_ID: ${CATEGORY_ID}

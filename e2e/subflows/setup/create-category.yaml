url: ${E2E_WEB_URL}
env:
  ICON: tag
  ICON_COLOR: "#336699"
---
# Optional caller-scoped params read by the script: OWNER (USER default, FAMILY or ALL), TYPE, PARENT_ID.
- runScript:
    file: ../../scripts/setup/create-category.js
    env:
      TOKEN: ${TOKEN}
      OWNER_ID: ${OWNER_ID}
      NAME: ${NAME}
      ICON: ${ICON}
      ICON_COLOR: ${ICON_COLOR}
